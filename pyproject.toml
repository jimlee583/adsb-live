[project]
name = "adsb-live"
version = "0.1.0"
description = "Realtime RF waterfall for a FlightAware/RTL-SDR receiver tuned around 1090 MHz."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jim Lee" }]
dependencies = [
    "numpy>=2.0",
    "pyrtlsdr[lib]>=0.3.0",
    "pyqtgraph>=0.13",
    "pyside6>=6.7",
]

[project.scripts]
adsb-live = "adsb_live.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adsb_live"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
